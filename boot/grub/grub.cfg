set timeout=5
set default=0

# GRUB debug to serial (QEMU -serial file): shows loader decisions.
serial --speed=38400 --unit=0 --word=8 --parity=no --stop=1
terminal_output --append serial
set debug=loader

# Linear framebuffer via GRUB (stub reads real mode from multiboot info).
# Video drivers + font must load explicitly; without loadfont, gfxterm
# silently stays in text mode (and no framebuffer is passed on).
insmod all_video
insmod gfxterm
loadfont $prefix/fonts/unicode.pf2
set gfxmode=1024x768x24,1024x768x32,1280x1024x24,auto
set gfxpayload=keep
terminal_output --append gfxterm serial

menuentry "NovaOS (multiboot)" {
    echo "Booting NovaOS via multiboot..."
    multiboot /boot/nova_stub.bin
    module /boot/KERNEL.BIN
    echo "Jumping to kernel..."
    boot
}

menuentry "NovaOS (multiboot, serial debug)" {
    echo "Booting NovaOS via multiboot (serial)..."
    multiboot /boot/nova_stub.bin
    module /boot/KERNEL.BIN
    serial --speed=38400 --unit=0 --word=8 --parity=no --stop=1
    terminal_input serial
    terminal_output serial
    boot
}
